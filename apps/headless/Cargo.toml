[package]
name = "opencut-headless"
description = "Typed local headless interface for the OpenCut editor core"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "opencut-headless"
path = "src/main.rs"

[features]
raster-cache-test-hooks = ["opencut-editor-core/raster-cache-test-hooks"]

[dependencies]
opencut-editor-core = { path = "../../crates/editor-core" }
serde = { workspace = true }
serde_json = { workspace = true }
strum = { workspace = true }

[dev-dependencies]
tempfile = "3.23"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Security", "Win32_System_JobObjects", "Win32_System_Threading"] }
