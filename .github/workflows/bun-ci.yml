name: OpenCut CI

concurrency:
  group: opencut-ci-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  openspec:
    name: OpenSpec validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup pinned toolchain
        uses: moonrepo/setup-toolchain@v0
        with:
          auto-install: true
          auto-setup: true
      - name: Validate living specs and active changes
        run: moon run openspec-validate

  correctness:
    name: Correctness (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Linux desktop dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libxcb1-dev libxkbcommon-dev libxkbcommon-x11-dev
      - name: Setup pinned toolchain
        uses: moonrepo/setup-toolchain@v0
        with:
          auto-install: true
          auto-setup: true
      - name: Install JavaScript dependencies
        working-directory: apps/agent-bridge
        run: bun install --frozen-lockfile
      - name: Rust formatting
        run: cargo fmt --check --all
      - name: Strict workspace Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Rust tests
        run: cargo test --workspace
      - name: TypeScript typecheck
        working-directory: apps/agent-bridge
        run: bun run typecheck
      - name: TypeScript lint
        working-directory: apps/agent-bridge
        run: bun run lint
      - name: Hermetic TypeScript unit tests
        working-directory: apps/agent-bridge
        run: bun run test
      - name: Minimal Python worker tests
        run: bun run apps/agent-bridge/scripts/run-python-tests.ts

  packaged-smoke:
    name: Packaged fake-provider integration and smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install FFmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Setup pinned toolchain
        uses: moonrepo/setup-toolchain@v0
        with:
          auto-install: true
          auto-setup: true
      - name: Install JavaScript dependencies
        working-directory: apps/agent-bridge
        run: bun install --frozen-lockfile
      - name: Build debug headless
        run: cargo build -p opencut-headless
      - name: Fake-provider MCP integration
        working-directory: apps/agent-bridge
        run: bun run test:integration
      - name: Isolated packaged smoke
        working-directory: apps/agent-bridge
        run: bun run test:smoke
