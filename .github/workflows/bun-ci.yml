name: OpenCut CI

concurrency:
  group: opencut-ci-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  openspec:
    name: OpenSpec validation
    runs-on: ubuntu-latest
    timeout-minutes: 135
    outputs:
      policy_validated: ${{ steps.policy.outputs.validated }}
    steps:
      - name: Setup bootstrap Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - name: Setup bootstrap Moon
        uses: moonrepo/setup-toolchain@v0
        with:
          auto-install: false
          auto-setup: false
          cache: false
          moon-version: 2.3.3
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Validate living specs and active changes
        id: policy
        run: bun --config=/dev/null --no-env-file run scripts/run-ci-policy.ts --attest-github-output

  contract-parity:
    name: Contract parity
    runs-on: ubuntu-latest
    timeout-minutes: 135
    steps:
      - uses: actions/checkout@v4
      - name: Setup pinned toolchain
        uses: moonrepo/setup-toolchain@v0
        with:
          auto-install: true
          auto-setup: true
      - name: Install JavaScript dependencies
        working-directory: apps/agent-bridge
        run: bun install --frozen-lockfile
      - name: Cross-language contract parity
        working-directory: apps/agent-bridge
        run: bun run contracts:check

  correctness:
    name: Correctness (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 135
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Linux desktop dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libxcb1-dev libxkbcommon-dev libxkbcommon-x11-dev
      - name: Setup pinned toolchain
        uses: moonrepo/setup-toolchain@v0
        with:
          auto-install: true
          auto-setup: true
      - name: Install JavaScript dependencies
        working-directory: apps/agent-bridge
        run: bun install --frozen-lockfile
      - name: Rust formatting
        run: cargo fmt --check --all
      - name: Strict workspace Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Rust tests
        run: cargo test --workspace
      - name: TypeScript typecheck
        working-directory: apps/agent-bridge
        run: bun run typecheck
      - name: TypeScript lint
        working-directory: apps/agent-bridge
        run: bun run lint
      - name: Hermetic TypeScript unit tests
        working-directory: apps/agent-bridge
        run: bun run test
      - name: Minimal Python worker tests
        run: bun run apps/agent-bridge/scripts/run-python-tests.ts

  render-parity:
    name: Render parity
    runs-on: ubuntu-latest
    timeout-minutes: 135
    steps:
      - uses: actions/checkout@v4
      - name: Install deterministic rendering dependencies
        run: sudo apt-get update && sudo apt-get install -y ffmpeg fonts-dejavu-core
      - name: Setup pinned toolchain
        uses: moonrepo/setup-toolchain@v0
        with:
          auto-install: true
          auto-setup: true
      - name: Install render bridge dependencies
        working-directory: apps/agent-bridge
        run: bun install --frozen-lockfile
      - name: Native audiovisual and lifecycle parity
        env:
          OPENCUT_FFMPEG_PATH: ffmpeg
          OPENCUT_FFPROBE_PATH: ffprobe
          OPENCUT_ANIMATION_CHANNEL_RENDER_REQUIRED: '1'
          OPENCUT_GOLDEN_REPORT_PATH: ${{ github.workspace }}/target/render-baseline-linux.json
          OPENCUT_GOLDEN_REQUIRED: '1'
          OPENCUT_TEST_FONT_PATH: /usr/share/fonts/truetype/dejavu/DejaVuSans.ttf
        run: |
          mkdir -p "$(dirname "$OPENCUT_GOLDEN_REPORT_PATH")"
          cargo test --release -p opencut-editor-core renderer::golden::native_golden_render_conformance -- --exact --nocapture
          cargo test -p opencut-headless native_render_lifecycle_survives_edit_undo_redo_reopen_and_isolates_drafts -- --exact
          cargo test -p opencut-editor-core --test transform2d
          cargo test -p opencut-editor-core --test animation_channels
          cargo test -p opencut-editor-core --test font_resolution
      - name: Native raster-cache parity
        env:
          OPENCUT_FFMPEG_PATH: ffmpeg
          OPENCUT_FFPROBE_PATH: ffprobe
          OPENCUT_GOLDEN_REQUIRED: '1'
          OPENCUT_TEST_FONT_PATH: /usr/share/fonts/truetype/dejavu/DejaVuSans.ttf
          OPENCUT_RASTER_CACHE_TESTS_REQUIRED: '1'
        run: |
          cargo test -p opencut-editor-core --lib raster_cach
          cargo test -p opencut-headless --features raster-cache-test-hooks --test render_worker
          cargo build -p opencut-headless --features raster-cache-test-hooks
          bun run --cwd apps/agent-bridge test:unit --no-file-parallelism tests/render-worker-native.test.ts
          cargo build -p opencut-headless
          cargo test -p opencut-headless
      - name: Validate Linux render baseline schema
        env:
          OPENCUT_GOLDEN_REPORT_PATH: ${{ github.workspace }}/target/render-baseline-linux.json
        run: cargo test -p opencut-editor-core renderer::golden::validate_external_performance_report -- --ignored --exact
      - name: Upload report-only Linux render baseline
        uses: actions/upload-artifact@v4
        with:
          name: render-baseline-linux-v3
          path: target/render-baseline-linux.json

  rules-screen-parity:
    name: Rules-screen parity (${{ matrix.resolution }})
    runs-on: ubuntu-latest
    timeout-minutes: 135
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        resolution: ['960x540', '1280x720', '1920x1080']
    steps:
      - uses: actions/checkout@v4
      - name: Install deterministic rendering dependencies
        run: sudo apt-get update && sudo apt-get install -y ffmpeg fonts-dejavu-core
      - name: Setup pinned toolchain
        uses: moonrepo/setup-toolchain@v0
        with:
          auto-install: true
          auto-setup: true
      - name: Native rules-screen resolution parity
        env:
          OPENCUT_FFMPEG_PATH: ffmpeg
          OPENCUT_FFPROBE_PATH: ffprobe
          OPENCUT_GOLDEN_REQUIRED: '1'
          OPENCUT_TEST_FONT_PATH: /usr/share/fonts/truetype/dejavu/DejaVuSans.ttf
          OPENCUT_RULES_SCREEN_RESOLUTION: ${{ matrix.resolution }}
        run: |
          set -euo pipefail
          cargo test --release -p opencut-editor-core --lib -- --list | grep -Fx 'renderer::golden::rules_screen::native_rules_screen_resolution_conformance: test'
          cargo test --release -p opencut-editor-core --lib renderer::golden::rules_screen::native_rules_screen_resolution_conformance -- --exact --nocapture

  foundation-parity:
    name: Motion-graphics foundation parity
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      contents: read
    needs: [openspec, contract-parity, render-parity, rules-screen-parity, correctness, packaged-smoke]
    if: ${{ always() }}
    steps:
      - name: Setup duration-audit Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - uses: actions/checkout@v4
      - name: Confirm foundation parity gates
        env:
          OPENSPEC_RESULT: ${{ needs.openspec.result }}
          OPENSPEC_POLICY_VALIDATED: ${{ needs.openspec.outputs.policy_validated }}
          CONTRACT_PARITY_RESULT: ${{ needs.contract-parity.result }}
          RENDER_PARITY_RESULT: ${{ needs.render-parity.result }}
          RULES_SCREEN_PARITY_RESULT: ${{ needs.rules-screen-parity.result }}
          CORRECTNESS_RESULT: ${{ needs.correctness.result }}
          PACKAGED_SMOKE_RESULT: ${{ needs.packaged-smoke.result }}
        run: |
          echo "OpenSpec validation: $OPENSPEC_RESULT"
          echo "OpenSpec policy attested: $OPENSPEC_POLICY_VALIDATED"
          echo "Contract parity: $CONTRACT_PARITY_RESULT"
          echo "Render parity: $RENDER_PARITY_RESULT"
          echo "Rules-screen parity: $RULES_SCREEN_PARITY_RESULT"
          echo "Correctness: $CORRECTNESS_RESULT"
          echo "Packaged smoke: $PACKAGED_SMOKE_RESULT"
          if [ "$OPENSPEC_RESULT" != "success" ] || [ "$OPENSPEC_POLICY_VALIDATED" != "true" ] || [ "$CONTRACT_PARITY_RESULT" != "success" ] || [ "$RENDER_PARITY_RESULT" != "success" ] || [ "$RULES_SCREEN_PARITY_RESULT" != "success" ] || [ "$CORRECTNESS_RESULT" != "success" ] || [ "$PACKAGED_SMOKE_RESULT" != "success" ]; then
            echo "Foundation parity requires attested policy validation and every required job to succeed." >&2
            exit 1
          fi
      - name: Enforce protected CI duration
        if: ${{ always() }}
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          CI_DURATION_OWNER: '@matiHirCab'
          CI_DURATION_REASON: 'Measured 1920x1080 rules-screen renderer cost; preserve all 75 renders while optimizing separately'
          CI_DURATION_BASELINE_MINUTES: '123.65'
          CI_DURATION_EVIDENCE_URL: 'https://github.com/matiHirCab/AI-Open-Cut/actions/runs/36244746913'
          CI_DURATION_EXPIRES_ON: '2026-10-26'
          CI_DURATION_CAP_MINUTES: '135'
        run: bun --config=/dev/null --no-env-file run scripts/ci-duration.ts

  packaged-smoke:
    name: Packaged fake-provider integration and smoke
    runs-on: ubuntu-latest
    timeout-minutes: 135
    steps:
      - uses: actions/checkout@v4
      - name: Setup pinned toolchain
        uses: moonrepo/setup-toolchain@v0
        with:
          auto-install: true
          auto-setup: true
      - name: Install JavaScript dependencies
        working-directory: apps/agent-bridge
        run: bun install --frozen-lockfile
      - name: Build debug headless
        run: cargo build -p opencut-headless
      - name: Fake-provider MCP integration
        working-directory: apps/agent-bridge
        run: bun run test:integration
      - name: Isolated packaged smoke
        working-directory: apps/agent-bridge
        run: bun run test:smoke
